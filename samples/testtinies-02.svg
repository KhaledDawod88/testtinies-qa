<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0b1a1a"/><stop offset="1" stop-color="#0f3a3a"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#bg)"/><text x="60" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="46" font-weight="800" fill="#fff" text-anchor="start" letter-spacing="2">TESTTINIES</text><text x="60" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="600" fill="#2dd4bf" text-anchor="start" >QA in 30 seconds: software testing basics</text><text x="1020" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="46" font-weight="800" fill="#2dd4bf" text-anchor="end" >#02</text><text x="60" y="310" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="74" font-weight="800" fill="#fff" text-anchor="start" >Equivalence</text><text x="60" y="395" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="74" font-weight="800" fill="#fff" text-anchor="start" >partitioning</text><text x="60" y="500" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="38" font-weight="500" fill="#ffffffcc" text-anchor="start" >A password needs 8 to 16 characters.</text><text x="60" y="551" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="38" font-weight="500" fill="#ffffffcc" text-anchor="start" >You do not need 20 tests. Pick one</text><text x="60" y="602" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="38" font-weight="500" fill="#ffffffcc" text-anchor="start" >value per group.</text><rect x="60" y="673" width="960" height="118" rx="24" fill="#ffffff12" opacity="1" stroke="#ff6b6b" stroke-width="2"/><circle cx="125" cy="732" r="30" fill="#ff6b6b"/><path d="M111 718 L139 746 M139 718 L111 746" stroke="#0b1020" stroke-width="8" fill="none" stroke-linecap="round"/><text x="185" y="727" font-family="'JetBrains Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#fff" text-anchor="start" >abc123</text><text x="185" y="767" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="500" fill="#ffffffb0" text-anchor="start" >too short group</text><rect x="60" y="813" width="960" height="118" rx="24" fill="#ffffff12" opacity="1" stroke="#4ade80" stroke-width="2"/><circle cx="125" cy="872" r="30" fill="#4ade80"/><path d="M110 873 L121 885 L142 859" stroke="#0b1020" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="185" y="867" font-family="'JetBrains Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#fff" text-anchor="start" >Passw0rd!</text><text x="185" y="907" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="500" fill="#ffffffb0" text-anchor="start" >valid group</text><rect x="60" y="953" width="960" height="118" rx="24" fill="#ffffff12" opacity="1" stroke="#ff6b6b" stroke-width="2"/><circle cx="125" cy="1012" r="30" fill="#ff6b6b"/><path d="M111 998 L139 1026 M139 998 L111 1026" stroke="#0b1020" stroke-width="8" fill="none" stroke-linecap="round"/><text x="185" y="1007" font-family="'JetBrains Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#fff" text-anchor="start" >a-very-long-password-123</text><text x="185" y="1047" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="500" fill="#ffffffb0" text-anchor="start" >too long group</text><rect x="60" y="1093" width="960" height="118" rx="24" fill="#ffffff12" opacity="1" stroke="#ff6b6b" stroke-width="2"/><circle cx="125" cy="1152" r="30" fill="#ff6b6b"/><path d="M111 1138 L139 1166 M139 1138 L111 1166" stroke="#0b1020" stroke-width="8" fill="none" stroke-linecap="round"/><text x="185" y="1147" font-family="'JetBrains Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="38" font-weight="700" fill="#fff" text-anchor="start" >(empty)</text><text x="185" y="1187" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="500" fill="#ffffffb0" text-anchor="start" >empty group</text><rect x="60" y="1253" width="960" height="235" rx="28" fill="#ffffff14" opacity="1" stroke="#2dd4bf" stroke-width="3"/><text x="100" y="1315" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="800" fill="#2dd4bf" text-anchor="start" letter-spacing="3">TESTER&#x27;S TIP</text><text x="100" y="1363" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="36" font-weight="500" fill="#fff" text-anchor="start" >Split the inputs into groups that</text><text x="100" y="1411" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="36" font-weight="500" fill="#fff" text-anchor="start" >behave the same, then test one value</text><text x="100" y="1460" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="36" font-weight="500" fill="#fff" text-anchor="start" >from each group.</text><rect x="60" y="1770" width="960" height="2" rx="1" fill="#2dd4bf" opacity="0.5"/><text x="60" y="1830" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="500" fill="#ffffffaa" text-anchor="start" >github.com/KhaledDawod88/testtinies-qa</text><text x="1020" y="1830" font-family="Inter, 'Segoe UI', Helvetica, Arial, 'Noto Sans', sans-serif" font-size="28" font-weight="600" fill="#2dd4bf" text-anchor="end" >free tools only</text></svg>
